name: Development  # Name of the workflow

on:
  push:
    branches: [main]  # Trigger the workflow on pushes to the 'main' branch

jobs:
  build:
    runs-on: [self-hosted, personal_v3]  # Run the job on a self-hosted runner tagged with 'personal_v3'

    steps:
      - name: Checkout repository  # Step to checkout the code from the repository
        uses: actions/checkout@v2  # Use the official GitHub checkout action

      - name: Setup Node.js  # Step to set up Node.js in the environment
        uses: actions/setup-node@v2  # Use the official GitHub Node.js setup action
        with:
          node-version: 18.x  # Specify the Node.js version to use (v18.x)

      - name: Install Node Modules  # Step to install Node.js dependencies
        run: npm ci  # Use 'npm ci' to install dependencies from 'package-lock.json' (faster and more reliable in CI)

      - name: Restart Application  # Step to restart the application using PM2
        run: pm2 restart personal_v3  # Restart the PM2 process named 'personal_v3'
