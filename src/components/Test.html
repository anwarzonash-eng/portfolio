<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Printable CV Example</title>
    <style>
      /* A4 Landscape */
      @page {
        size: A4 landscape;
        margin: 2cm;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #333;
      }

      .container {
        max-width: 100%;
        margin: 0 auto;
        background: #fff;
        padding: 2rem;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
      }

      p {
        font-size: 1rem;
        line-height: 1.4;
      }

      /* Styled Link as Button */
      .button-link {
        display: inline-block;
        padding: 1rem 2rem;
        margin: 1rem 0;
        background: #007bff;
        color: #fff;
        text-decoration: none;
        border-radius: 4px;
        font-weight: bold;
      }

      .button-link:hover {
        background: #0056b3;
      }

      /* Print adjustments */
      @media print {
        body {
          background: #fff;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>My CV</h1>
      <p>
        Hello, this is my printable CV page. Below are my links that look like
        buttons:
      </p>

      <!-- ✅ This is actually a link but styled as a button -->
      <a href="https://www.linkedin.com" target="_blank" class="button-link">
        Visit LinkedIn
      </a>

      <br />

      <a href="mailto:someone@example.com" class="button-link"> Email Me </a>

      <br />

      <a href="https://calendly.com" target="_blank" class="button-link">
        Schedule a Call
      </a>

      <p>
        When you print this page to PDF, these buttons will remain clickable
        links in the PDF file.
      </p>
    </div>
  </body>
</html>
